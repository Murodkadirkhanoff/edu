version: '3.8'

services:
    app:
        #        image: ihateyou77/chashma.uz:latest
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: laravel-app
        restart: unless-stopped
        working_dir: /var/www/html
        depends_on:
            - app_db
        volumes:
            - .:/var/www/html
        networks:
            - app-network
        user: "${UID}:${GID}"
    web:
        image: nginx:alpine
        container_name: laravel-nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html                # 👈 вот это важно
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - app-network
        healthcheck:
            test: [ "CMD", "wget", "--spider", "-q", "http://localhost" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    app_db:
        image: postgres:17.5
        container_name: app_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: app_db
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app-network

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@local.com
            PGADMIN_DEFAULT_PASSWORD: admin123
        ports:
            - "5050:80"
        depends_on:
            - app_db
        networks:
            - app-network


