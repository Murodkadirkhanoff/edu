    certbot:
        image: certbot/certbot
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        entrypoint: /bin/sh -c
        command: >
            "trap exit TERM;
             while :; do
               certbot renew;
               sleep 12h & wait $${!};
             done"
volumes:
    app-data:
    pgdata:
    video-uploader:

networks:
    app-network:
        driver: bridge
